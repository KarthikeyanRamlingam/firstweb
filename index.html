<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media</title>
</head>
<body>
    <h1>IMAGE</h1>
    <img src="media/images.jpeg" alt="image" width="200" height="300" title="sivam" style="border: 2px solid black; border-radius: 10px;">
    <h1>VIDEO</h1>
    <div>
        <video width="320" height="240" controls autoplay title="siva vedio" loop playsinline poster="media/images.jpeg" muted>
            <source src="media/siva.mp4" type="video/mp4" style="border: 2px solid black; border-radius: 10px;">
        </video>
    </div>
    <hr>
    <h1>AUDIO</h1>
    <div>
        <audio controls autoplay loop title="siva audio" muted>
            <source src="media/sivaaudio.mp3" type="audio/mpeg">
        </audio>
</body>
</html>
